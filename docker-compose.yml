services:
  web:
    build: .
    # Gunicorn запустится через CMD в Dockerfile. Здесь не нужен command.
    volumes:
      - static:/staticfiles
      - media:/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - app-net

  db:
    image: postgres:15-alpine  # Лучше 15, чем 18 — стабильнее для учебных проектов
    container_name: shop_db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-net
    # ВАЖНО: нет ports — база недоступна извне

  redis:
    image: redis:7-alpine
    container_name: shop_redis_container
    volumes:
      - redisdata:/data
    restart: always
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/staticfiles
    depends_on:
      web:
        condition: service_started
    restart: always
    networks:
      - app-net

volumes:
  pgdata:
  redisdata:
  static:
  media:

networks:
  app-net:
    driver: bridge
