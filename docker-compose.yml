services:
  web:
    build: .
    container_name: shop-api-web
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - REDIS_HOST=redis
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Если используешь DATABASE_URL — оставь его, если нет — удали
    networks:
      - shop-api_network
    depends_on:
      - db
      - redis

  db:                          # <-- ЭТО ИМЯ И ЕСТЬ ТВОЙ ХОСТ "db"
    image: postgres:15-alpine
    container_name: shop-api-db-1
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: Qwerty12345
      POSTGRES_DB: shop_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shop-api_network

  redis:
    image: redis:7-alpine
    container_name: shop-api-redis-1
    networks:
      - shop-api_network

networks:
  shop-api_network:
    name: shop-api_default   # <-- Та же сеть, что у тебя уже есть

volumes:
  pgdata:
